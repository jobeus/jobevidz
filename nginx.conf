# JobeVidz Nginx Configuration
# Place this file in /etc/nginx/sites-available/jobevidz
# Then create symlink: sudo ln -s /etc/nginx/sites-available/jobevidz /etc/nginx/sites-enabled/

# API Server
server {
    listen 80;
    server_name api.yourdomain.com;

    # Increase client body size for video uploads (1GB)
    client_max_body_size 1G;
    
    # Increase timeouts for large uploads
    client_body_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Logging
    access_log /var/log/nginx/jobevidz-api-access.log;
    error_log /var/log/nginx/jobevidz-api-error.log;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Disable buffering for large uploads
        proxy_request_buffering off;
    }
}

# Client (Frontend)
server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    root /var/www/jobevidz/client/dist;
    index index.html;

    # Logging
    access_log /var/log/nginx/jobevidz-client-access.log;
    error_log /var/log/nginx/jobevidz-client-error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Security headers (default for most pages)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Proxy API routes to backend
    location /api/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Security headers for API
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Proxy /v/ routes to backend (for meta tags and JSON API)
    location /v/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header User-Agent $http_user_agent;

        # Security headers for video pages
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Proxy /embed/ routes to backend (allow iframe embedding)
    location /embed/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow embedding in iframes from any origin
        add_header X-Frame-Options "ALLOWALL" always;
        add_header Content-Security-Policy "frame-ancestors *" always;
    }

    # Proxy /oembed route to backend
    location /oembed {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Security headers for oEmbed
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Proxy /uploads/ to backend for video and thumbnail serving
    location /uploads/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Enable range requests for video streaming
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_cache_bypass $http_range;

        # Cache uploaded content
        expires 1y;
        add_header Cache-Control "public, immutable";

        # Allow CORS for video playback
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Main location - SPA routing
    location / {
        try_files $uri $uri/ /index.html;

        # Security headers for SPA
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Don't cache index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }
}

